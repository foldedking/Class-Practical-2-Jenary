<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Page</title>
  <link rel="stylesheet" href="plan-page.css">
</head>
<body>
  <section class="plans">
    <article>
      <h1>Basic</h1>
      <p class="price">$9</p>
      <p>per month</p>
      <ul>
        <li>1 Website</li>
        <li>10 GB Storage</li>
        <li>Basic Support</li>
      </ul>
      <button type="button">SELECT PLAN</button>
    </article>
    <article>
      <h1>Professional</h1>
      <p class="price">$19</p>
      <p>per month</p>
      <ul>
        <li>10 Websites</li>
        <li>50 GB Storage</li>
        <li>Priority Support</li>
      </ul>
      <button type="button">SELECT PLAN</button>
    </article>
    <article>
      <h1>Premium</h1>
      <p class="price">$29</p>
      <p>per month</p>
      <ul>
        <li>Unlimited Websites</li>
        <li>100 GB Storage</li>
        <li>24/7 Support</li>
      </ul>
      <button type="button">SELECT PLAN</button>
    </article>
  </section>
</body>
</html>
